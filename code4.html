<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Layout</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>

  <div class="dashboard">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <h1>My Dashboard</h1>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <nav>
        <a href="#">Overview</a>
        <a href="#">Analytics</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main">
      <div class="box">Revenue</div>
      <div class="box">Users</div>
      <div class="box span-2">Performance Overview (spans 2 columns)</div>
      <div class="box">Sales</div>
    </main>

  </div>

</body>
</html>
