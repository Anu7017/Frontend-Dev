<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="navbar.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <h1 class="logo">MyWebsite</h1>
      <ul class="nav-links">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Contact</a></li>

  <main>
    <section class="content">
      <h2>Welcome to My Website</h2>
      <p>Hover over the navigation links to see smooth transitions and active highlights.</p>
    </section>
  </main>

  <footer>
    <p>© 2025 Navigation Bar Demonstration</p>
  </footer>

</body>
</html>
