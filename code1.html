<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Example – Question 1</title>

  <!-- Bootstrap 5 via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Link your separate CSS file -->
  <link rel="stylesheet" href="question1.css">
</head>
<body>

  <header class="bg-primary text-white text-center py-3">
    <h1>My Bootstrap Webpage</h1>
  </header>

  <main class="container my-5">
    <section class="row">
      <div class="col-md-6">
        <h2>About</h2>
        <p>This is an example Bootstrap layout with a separate CSS file.</p>
      </div>
      <div class="col-md-6">
        <img src="https://picsum.photos/400/200" class="img-fluid rounded" alt="Sample image">
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white text-center py-2">
    <p>© 2025 My Website</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
