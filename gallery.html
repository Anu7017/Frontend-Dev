
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .photo {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .photo:hover img {
      transform: scale(1.1);
    }

    .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      text-align: center;
      padding: 10px;
      opacity: 0;
      transition: opacity 0.4s ease;
      font-size: 1rem;
    }

    .photo:hover .caption {
      opacity: 1;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <h1>My Photo Gallery</h1>

  <div class="gallery">
    <div class="photo">
      <img src="https://picsum.photos/id/1015/400/300" alt="Nature 1">
      <div class="caption">Mountain View</div>
    </div>
    <div class="photo">
      <img src="https://picsum.photos/id/1025/400/300" alt="Nature 2">
      <div class="caption">Beautiful Dog</div>
    </div>
    <div class="photo">
      <img src="https://picsum.photos/id/1035/400/300" alt="Nature 3">
      <div class="caption">Sunset Beach</div>
    </div>
    <div class="photo">
      <img src="https://picsum.photos/id/1045/400/300" alt="Nature 4">
      <div class="caption">Forest Trail</div>
    </div>
    <div class="photo">
      <img src="https://picsum.photos/id/1055/400/300" alt="Nature 5">
      <div class="caption">City Skyline</div>
    </div>
    <div class="photo">
      <img src="https://picsum.photos/id/1065/400/300" alt="Nature 6">
      <div class="caption">Desert Road</div>
    </div>
  </div>
</body>
</html>
