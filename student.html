<!DOCTYPE html>
<html>
<head>
<style>
input { margin: 6px 0; padding: 8px; }
.success { border: 2px solid green; }
.error { border: 2px solid red; }
span { color: red; font-size: 12px; }
</style>
</head>
<body>

<form id="studentForm">
  <input type="text" id="name" placeholder="Name"><br><span id="nameErr"></span><br>
  <input type="text" id="email" placeholder="Email"><br><span id="emailErr"></span><br>
  <input type="text" id="phone" placeholder="Phone"><br><span id="phoneErr"></span><br>
  <input type="password" id="password" placeholder="Password"><br><span id="passErr"></span><br>
  <button type="submit">Submit</button>
</form>

<script src="form.js"></script>
</body>
</html>
