<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="flipcard.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-inner">
        <div class="card-front">
          <img src="https://via.placeholder.com/250x150" alt="Card Image">
          <h2>My Project</h2>
        </div>
        <div class="card-back">
          <h3>About This Project</h3>
          <p>This project showcases a simple CSS flip animation using 3D transforms and smooth transitions.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
