<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalog</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <!-- Header -->
  <header class="text-center py-4 bg-white shadow-sm">
    <h1 class="fw-bold">Online Store</h1>
    <p class="text-muted mb-0">Explore our latest products</p>
  </header>

  <!-- Product Section -->
  <main class="container my-5">
    <div class="row g-4"><!-- g-4 adds gap between cards -->

      <!-- Product 1 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card h-100 text-center p-3">
          <img src="https://via.placeholder.com/200x200.png?text=Product+1" class="card-img-top img-fluid" alt="Product 1">
          <div class="card-body">
            <h5 class="card-title fw-bold">Product 1</h5>
            <p class="card-text text-success mb-2">$25.00</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card h-100 text-center p-3">
          <img src="https://via.placeholder.com/200x200.png?text=Product+2" class="card-img-top img-fluid" alt="Product 2">
          <div class="card-body">
            <h5 class="card-title fw-bold">Product 2</h5>
            <p class="card-text text-success mb-2">$30.00</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card h-100 text-center p-3">
          <img src="https://via.placeholder.com/200x200.png?text=Product+3" class="card-img-top img-fluid" alt="Product 3">
          <div class="card-body">
            <h5 class="card-title fw-bold">Product 3</h5>
            <p class="card-text text-success mb-2">$40.00</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 4 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card h-100 text-center p-3">
          <img src="https://via.placeholder.com/200x200.png?text=Product+4" class="card-img-top img-fluid" alt="Product 4">
          <div class="card-body">
            <h5 class="card-title fw-bold">Product 4</h5>
            <p class="card-text text-success mb-2">$50.00</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-3 bg-white shadow-sm mt-5">
    <p class="mb-0 text-muted">&copy; 2025 Online Store. All rights reserved.</p>
  </footer>

</body>
</html>
