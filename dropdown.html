<!DOCTYPE html>
<html>
<head>
  <title>Dropdown Selection Page</title>
</head>
<body>
  <h1>Travel Selection Page</h1>

  <label>Country:</label>
  <select>
    <option selected>India</option>
    <option>USA</option>
    <option>Japan</option>
  </select>
  <br><br>

  <label>State:</label>
  <select>
    <option selected>Rajasthan</option>
    <option>Delhi</option>
    <option>Maharashtra</option>
  </select>
  <br><br>

  <label>City:</label>
  <select>
    <option selected>Jaipur</option>
    <option>Mumbai</option>
    <option>Tokyo</option>
  </select>
  <br><br>

  <label>Favorite Tourist Place:</label>
  <select>
    <option selected>Hawa Mahal</option>
    <option>Taj Mahal</option>
    <option>Eiffel Tower</option>
  </select>
  <br><br>

  <p>You selected India, Rajasthan, Jaipur, and your favorite place is Hawa Mahal.</p>

  <footer>
    <p>&copy; 2025 Travel Selector</p>
  </footer>
</body>
</html>
